<!--
  Dowaba AI for PrestaShop — 260x152 thumbnail (HTML mockup)

  PNG render (Chrome headless):
    /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
      --headless --screenshot=thumbnail-260x152.png --window-size=260,152 \
      --hide-scrollbars \
      file://$PWD/thumbnail-260x152.html

  Bu boyut OpenCart marketplace küçük kart için. PrestaShop Addons modül listing'inde
  250x250 kullanılır — aynı template scale edilir.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 260px; height: 152px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0e1442 0%, #2a1240 60%, #7a0a3c 100%);
    color: #fff;
    position: relative;
  }
  .free-badge {
    position: absolute; top: 8px; right: 8px;
    background: #10b981; color: #fff;
    font-weight: 800; font-size: 9px;
    padding: 3px 8px; border-radius: 8px;
    letter-spacing: 0.6px;
  }
  .inner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; height: 100%; }
  .bot {
    width: 52px; height: 42px;
    background: linear-gradient(135deg, #ff5fa2, #df0067);
    border-radius: 9px;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(223, 0, 103, 0.45);
  }
  .bot::after {
    content: ''; position: absolute; top: -8px; left: 50%;
    width: 4px; height: 4px; background: #ff5fa2; border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 6px rgba(255, 95, 162, 0.8), 0 -8px 0 -2px #ff5fa2;
  }
  .eyes {
    position: absolute; top: 11px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
  }
  .eye { width: 8px; height: 8px; background: #fff; border-radius: 50%; }
  .smile {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 10px;
    border: 1.8px solid #fff; border-top: 0; border-radius: 0 0 14px 14px;
  }
  .text-block { flex: 1; min-width: 0; }
  .title { font-size: 17px; font-weight: 900; letter-spacing: -0.2px; line-height: 1.05; }
  .subtitle {
    color: #ff5fa2; font-size: 8px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
    margin-top: 3px;
  }
  .channels {
    margin-top: 8px;
    display: flex; gap: 4px;
  }
  .ch {
    font-size: 7px; font-weight: 700; padding: 2px 6px;
    border-radius: 6px; color: #fff;
  }
  .ch-wa { background: #25D366; }
  .ch-ig { background: linear-gradient(135deg, #f09433, #dc2743); }
  .ch-tk { background: #000; }
  .footer {
    position: absolute; bottom: 5px; left: 18px;
    font-size: 7px; color: #a8a3b8; letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="free-badge">FREE</div>

  <div class="inner">
    <div class="bot">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="smile"></div>
    </div>
    <div class="text-block">
      <div class="title">Dowaba AI</div>
      <div class="subtitle">PrestaShop · 1.7 + 8.x</div>
      <div class="channels">
        <span class="ch ch-wa">WhatsApp</span>
        <span class="ch ch-ig">IG</span>
        <span class="ch ch-tk">TikTok</span>
      </div>
    </div>
  </div>
  <div class="footer">v0.1.0 · MIT · dowaba.com</div>
</body>
</html>
