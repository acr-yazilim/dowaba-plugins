# Lokal test ortamı: OpenCart 4.x + MariaDB 11 + Mailpit
#
# Usage:
#   cd docker/
#   docker compose up -d              # start
#   docker compose logs -f opencart   # tail logs
#   docker compose down -v            # stop + reset DB
#
# URLs:
#   OpenCart storefront: http://localhost:8080
#   OpenCart admin:      http://localhost:8080/admin  (admin / admin123)
#   Mailpit UI:          http://localhost:8025
#
# Notes:
#   - seed.sql 10 dummy product + 3 dummy order + admin user
#   - host.docker.internal → host machine'e ulaşmak için (Dowaba prod manifest import için lokal URL)

services:
  opencart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dwb-opencart
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # OpenCart 4.0.2.3 source (host'a /tmp altına indirildi)
      - /tmp/dwb-oc4-src/opencart-4.0.2.3/upload:/var/www/html
      # Plugin kaynağımız (storage area, install sırasında manuel kopyalanır veya OCMOD install ile)
      - ../src:/var/www/html/dwb-plugin-src:ro

  mariadb:
    image: mariadb:11
    container_name: dwb-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: dwbtest_root
      MARIADB_DATABASE: opencart
      MARIADB_USER: opencart
      MARIADB_PASSWORD: dwbtest
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - mariadb-data:/var/lib/mysql
    # NOT: 3306 dışarı expose edilmedi — host'ta zaten MariaDB var. Plugin container'dan
    # `mariadb` hostname'iyle bağlanıyor, dış erişim Faz 4'te gereksiz.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: dwb-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mariadb-data:
