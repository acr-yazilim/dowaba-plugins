<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 260px;
    height: 152px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4c1d95 100%);
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 16px;
    position: relative;
  }
  .free {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #10b981;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .subtitle {
    font-size: 9px;
    font-weight: 600;
    color: #67e8f9;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .channels {
    display: flex;
    gap: 5px;
    margin-top: 8px;
  }
  .channel {
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
  }
  .ch-wa { background: #25D366; }
  .ch-ig { background: #E4405F; }
  .ch-tt { background: #000; border: 1px solid #25F4EE; color: #25F4EE; }
  .bottom {
    font-size: 9px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bottom strong { color: #fff; font-weight: 700; }
  .dots {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 30px;
    height: 30px;
    background-image:
      radial-gradient(circle 1.5px at 5px 5px, rgba(255,255,255,0.2) 100%, transparent 100%),
      radial-gradient(circle 1.5px at 15px 5px, rgba(255,255,255,0.2) 100%, transparent 100%),
      radial-gradient(circle 1.5px at 5px 15px, rgba(255,255,255,0.2) 100%, transparent 100%);
  }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="free">FREE</div>

  <div>
    <div class="title">DoWaba AI</div>
    <div class="subtitle">SELL ON SOCIAL</div>
  </div>

  <div class="channels">
    <span class="channel ch-wa">WhatsApp</span>
    <span class="channel ch-ig">Instagram</span>
    <span class="channel ch-tt">TikTok</span>
  </div>

  <div class="bottom">
    <strong>OpenCart 3 + 4</strong> · 10 AI functions
  </div>
</body>
</html>
