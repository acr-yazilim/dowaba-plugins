name: Release WooCommerce plugin

on:
  push:
    tags:
      - 'woocommerce-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/woocommerce-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build .zip
        working-directory: woocommerce
        run: bash build.sh "${{ steps.version.outputs.version }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WooCommerce v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            # DoWaba AI for WooCommerce v${{ steps.version.outputs.version }}

            📦 Download: `dowaba-ai-${{ steps.version.outputs.version }}.zip`

            ## Install

            WordPress admin → Plugins → Add New → Upload Plugin

            ## Docs

            - [README](./woocommerce/README.md)
            - [readme.txt (wp.org)](./woocommerce/readme.txt)
            - [CHANGELOG](./woocommerce/CHANGELOG.md)

            Auto-built by GitHub Actions.
          files: woocommerce/dist/dowaba-ai-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
